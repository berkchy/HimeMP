name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/core
      - name: Check formatting
        run: cargo fmt --manifest-path rust/core/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/core/Cargo.toml --all-targets
      - name: Unit tests
        run: cargo test --manifest-path rust/core/Cargo.toml
      - name: Cross-check Android targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo check --manifest-path rust/core/Cargo.toml --target "$target"
          done

  android:
    name: Android APK (signed release)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust native libraries into jniLibs
        working-directory: rust/core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../../android/app/src/main/jniLibs \
            build --release
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble signed release APK
        working-directory: android
        env:
          HIMEMP_KEYSTORE_B64: ${{ secrets.HIMEMP_KEYSTORE_B64 }}
          HIMEMP_STORE_PASSWORD: ${{ secrets.HIMEMP_STORE_PASSWORD }}
          HIMEMP_KEY_ALIAS: ${{ secrets.HIMEMP_KEY_ALIAS }}
          HIMEMP_KEY_PASSWORD: ${{ secrets.HIMEMP_KEY_PASSWORD }}
        run: |
          if [ -n "$HIMEMP_KEYSTORE_B64" ]; then
            printf '%s' "$HIMEMP_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/himemp-release.jks"
            export HIMEMP_KEYSTORE="$RUNNER_TEMP/himemp-release.jks"
          fi
          ./gradlew assembleRelease -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="${GITHUB_REF_NAME}"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: himemp-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: himemp-apks
          path: apks
      - name: Prepare release assets
        run: |
          mkdir -p release
          find apks -type f -name '*.apk' -print0 | while IFS= read -r -d '' file; do
            variant=$(basename "$(dirname "$file")")
            cp "$file" "release/HimeMP-${GITHUB_REF_NAME}-${variant}.apk"
          done
          ls -lh release
      - name: Publish versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HimeMP ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
      - name: Update rolling nightly release (main push / manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: HimeMP nightly
          prerelease: true
          overwrite_files: true
          generate_release_notes: false
          body: Continuous build from ${{ github.sha }}
          files: release/*.apk
