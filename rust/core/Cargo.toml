[package]
name = "himemp-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Lightweight Rust core for HimeMP: library indexing, metadata, playback engine and state"

[lib]
name = "himemp_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "wav", "isomp4", "aac", "pcm", "vorbis"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
